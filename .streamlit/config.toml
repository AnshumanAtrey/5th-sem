[theme]
base = "dark"
primaryColor = "#2dd4bf"
backgroundColor = "#0b1324"
secondaryBackgroundColor = "#111c33"
textColor = "#e6edf7"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
# serves flow-sentinel/static/ at /app/static/ for the Case Study 148 web app (flow-sentinel/streamlit_app.py)
enableStaticServing = true
